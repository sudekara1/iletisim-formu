<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <form class="contact-form">
      <h2>Bize Ulaşın</h2>
      
      <div class="row">
        <div class="input-group">
          <label for="firstName">Ad *</label>
          <input type="text" id="firstName" required />
        </div>
        <div class="input-group">
          <label for="lastName">Soyad*</label>
          <input type="text" id="lastName" required />
        </div>
      </div>

      <div class="input-group full-width">
        <label for="email">Email Adresi *</label>
        <input type="email" id="email" required />
      </div>

      <div class="input-group full-width">
        <label>Sorgu Türü *</label>
        <div class="radio-group">
          <label><input type="radio" name="query" required /> Genel Sorgulama</label>
          <label><input type="radio" name="query" required /> Destek Talebi</label>
        </div>
      </div>

      <div class="input-group full-width">
        <label for="message">Mesaj *</label>
        <textarea id="message" rows="4" required></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="consent" required />
        <label for="consent">Ekip tarafından benimle iletişime geçilmesine izin veriyorum *</label>
      </div>

      <button type="submit">Gönder</button>
    </form>
  </div>
</body>
</html>
